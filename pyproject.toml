[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lai"
version = "1.8.2"
description = "LAI — a native OS-level autonomous agent for Linux. The desktop is the page."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mss>=9.0",
    "pillow>=10.0",
    "python-xlib>=0.33",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
tui = ["textual>=0.60"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
lai = "lai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The browser interface is a single file served verbatim by the daemon; it has
# to travel with the wheel or `lai web` serves a 500.
"lai.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "x11: requires a live X11 display",
    "slow: slow test",
    "network: requires network access",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/lai"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "PIE", "RUF", "PERF", "PLC0415"]
ignore = [
    # Deliberate architecture, not oversights:
    "BLE001",  # perception and optional subsystems degrade rather than raise;
               # a bare `except Exception` at those boundaries is the design
    "S110",    # ditto — try/except/pass is how an optional probe reports absence
    "S112",    # ditto for loops that skip a dead window mid-walk
    "S603",    # subprocess calls are the OS layer's whole job
    "S404",    # importing subprocess is likewise the point
    "S607",    # xdotool/ffmpeg/tesseract are resolved via PATH on purpose
    "S101",    # asserts in tests
    "DTZ",     # the cron engine is deliberately local-time (a user's "9am")
    "RUF012",  # ClassVar annotations on handler tables add noise here
    "PLC0415", # imports are deliberately local where a dependency is optional
               # (tesseract, ffmpeg, textual, mcp) or where a module-level import
               # would be circular — see tools/__init__.py
    "RUF100",  # a `# noqa: X - reason` here documents intent for readers;
               # do not let an autofix strip the reason with the marker
    "PERF203", # try/except inside a loop is how per-item failures stay contained
]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint.per-file-ignores]
# Test files: fake secrets and /tmp paths are the point, a long assertion reads
# better on one line, and 0.0.0.0 appears only in the test that it is refused.
"tests/*" = ["S105", "S106", "S108", "S104", "S606", "B017", "B008", "PERF", "E501", "C408", "RUF015"]
# S606: the bootstrap test forks a pty and execs /bin/sh on purpose — that is
# the behaviour under test, not an accident.
